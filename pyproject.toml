[project]
name = "landscape-locust"
version = "0.0.1"
description = "Monorepo root — see src/locustfiles and src/exchange for packages."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["ty==0.0.15", "ruff==0.15.0"]

[tool.ruff]
line-length = 120
target-version = "py312"
select = ["ALL"]
ignore = ["COM812", "D", "ANN201", "BLE", "S"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.rules]
